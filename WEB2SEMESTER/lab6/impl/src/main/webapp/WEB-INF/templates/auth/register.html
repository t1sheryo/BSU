<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Телефонная станция</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Телефонная станция</h1>
            <p class="subtitle">Регистрация нового пользователя</p>
        </header>

        <nav class="menu">
            <ul>
                <li><a th:href="@{/home}">Главная</a></li>
                <li><a th:href="@{/login}">Вход</a></li>
            </ul>
        </nav>

        <main>
            <div class="auth-form">
                <h2>Регистрация</h2>
                
                <div th:if="${error != null}" class="alert alert-error">
                    <p th:text="${error}">Ошибка</p>
                </div>
                
                <form th:action="@{/register}" method="post">
                    <div class="form-group">
                        <label for="username">Имя пользователя:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
                
                <p class="auth-link">
                    Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
                </p>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Телефонная станция. Все права защищены.</p>
        </footer>
    </div>
</body>
</html>
