<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить сервис - Телефонная станция</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Телефонная станция</h1>
            <p class="subtitle">Добавление нового сервиса</p>
        </header>

        <nav class="menu">
            <ul>
                <li><a th:href="@{/}">Главная</a></li>
                <li><a th:href="@{/services}">Все сервисы</a></li>
                <li><a th:href="@{/services/available}">Доступные сервисы</a></li>
                <li><a th:href="@{/services/create}">Добавить сервис</a></li>
            </ul>
        </nav>

        <main>
            <div class="page-header">
                <h2>Добавить новый сервис</h2>
            </div>

            <form th:action="@{/services/create}" method="post" class="service-form">
                <div class="form-group">
                    <label for="name">Название сервиса *</label>
                    <input type="text" id="name" name="name" required 
                           placeholder="Введите название сервиса" class="form-control">
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="4" 
                              placeholder="Введите описание сервиса" class="form-control"></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Цена (руб.) *</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" required 
                           placeholder="0.00" class="form-control">
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="available" checked>
                        <span>Сервис доступен</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Создать сервис</button>
                    <a th:href="@{/services}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2024 Телефонная станция. Все права защищены.</p>
        </footer>
    </div>
</body>
</html>
